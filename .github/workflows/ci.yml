name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Keep this job name stable: Vercel Deployment Checks identify the required check by it.
  ci:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to full commit SHAs (tags are mutable); the comment
      # carries the release so update bots and humans can follow it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json # reads engines.node

      # Node 25+ no longer bundles corepack. The repo pins Yarn via `packageManager` and
      # `yarnPath`, so corepack only needs to provide the `yarn` shim.
      - name: Enable Yarn via corepack
        run: npm install --global --ignore-scripts corepack@0.36.0 && corepack enable

      - name: Locate Yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      # Exact key only (no restore-keys fallback): Yarn does not checksum platform-specific
      # native packages, so only restore a cache produced from this exact lockfile.
      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - run: yarn install --immutable
      - run: yarn fmt:check
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn knip
      - run: yarn build
